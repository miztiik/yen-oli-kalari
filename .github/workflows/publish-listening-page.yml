# Publish the listening page, with every model the benchmark measured.
#
# It voices on the runner rather than reading committed audio, because the
# repository carries no clips: 24 summaries is 42 MB of WAV per model, and the
# audio is deterministic from a committed corpus, so a clone regenerates it
# rather than carrying it forever.
#
# That makes the publish a measurement. The figures on the published page came
# off the production runner, which is the only hardware whose wall clock may be
# compared against the job cap.
name: publish the listening page

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated model ids, or "all"
        default: all
        type: string
      bitrate:
        description: Opus bitrate for the published audio
        default: 24k
        type: string
      grade:
        description: Transcribe the verbalization suite and publish the grades
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and a newer one wins. Two deploys racing would leave
# whichever finished last on the site regardless of which was newer.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.fanout.outputs.node }}
      python: ${{ steps.fanout.outputs.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - id: fanout
        run: node .github/scripts/plan-benchmark.mjs
        env:
          WANTED: ${{ inputs.models }}

  voice:
    needs: plan
    if: needs.plan.outputs.node != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.node) }}
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/voice-evaluation/package-lock.json

      # Weights stream from Hugging Face into the runner cache and never reach
      # the repository. This is what keeps the number of comparable models
      # bounded by runner RAM rather than by repository size.
      - name: Cache the weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.model }}-v2
          restore-keys: hf-

      # Voicing a model costs about twenty minutes and the audio is
      # deterministic, so a re-publish that changes only the page does not pay
      # for it again. The key carries everything that changes the audio.
      - name: Cache the voiced audio
        id: voiced
        uses: actions/cache@v6
        with:
          path: test/voice-evaluation/results/${{ matrix.model }}
          key: voiced-${{ matrix.model }}-${{ hashFiles('test/voice-evaluation/benchmark-model.mjs', 'test/voice-evaluation/voices.config.json', 'test/onnx-runtime-comparison/real-summaries/summaries.json', 'test/onnx-runtime-comparison/verbalization-suite.json') }}

      - run: npm ci --no-audit --no-fund

      - name: Record the runner
        run: |
          echo "cores: $(nproc)"
          lscpu | grep -E 'Model name' || true

      - name: Voice the corpus
        if: steps.voiced.outputs.cache-hit != 'true'
        env:
          MODEL: ${{ matrix.model }}
        run: node benchmark-model.mjs

      - name: Grade the verbalization suite
        if: ${{ inputs.grade && steps.voiced.outputs.cache-hit != 'true' }}
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python grade_verbalization.py

      - uses: actions/upload-artifact@v4
        with:
          name: voiced-${{ matrix.model }}
          path: test/voice-evaluation/results/${{ matrix.model }}/
          if-no-files-found: error
          retention-days: 3

  build:
    needs: [plan, voice]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/download-artifact@v5
        with:
          pattern: voiced-*
          path: test/voice-evaluation/results

      # ffmpeg is not on the ubuntu-latest image, so it is installed rather than
      # assumed. A previous run died at exit 127 here after twenty-two minutes
      # of voicing had already been spent.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # WAV is the synthesiser's output, not a publishing format: 24 summaries
      # is 42 MB of it per model. Opus at 24k is the codec the design already
      # chose and lands the same audio in roughly 3 MB. The container is `.ogg`
      # because a bare `.opus` file is served as text/plain by some hosts.
      - name: Encode for the web
        env:
          BITRATE: ${{ inputs.bitrate }}
        run: |
          set -euo pipefail
          before=$(du -sm results | cut -f1)
          find results -name '*.wav' -print0 | while IFS= read -r -d '' wav; do
            ffmpeg -nostdin -loglevel error -i "$wav" \
              -c:a libopus -b:a "$BITRATE" -vbr on -application voip \
              "${wav%.wav}.ogg"
          done
          after=$(du -sm --exclude='*.wav' results | cut -f1)
          echo "WAV ${before} MB -> opus@${BITRATE} ${after} MB"

      - name: Assemble the site
        env:
          CLIP_BASE: ./results/
          CLIP_EXTENSION: .ogg
        run: |
          set -euo pipefail
          # The page is a shell: this writes an index naming the runs and where
          # each manifest lives, and the browser fetches the rest. Inlining the
          # clips instead would put every run's text in every visitor's first
          # request to read one.
          node build-page-index.mjs
          mkdir -p _site
          cp page/index.html page/styles.css page/app.js page/store.js page/index.json _site/
          # The encoded audio and the manifests only. Each manifest is the
          # measurement its own audio produced, published beside it so a figure
          # on the page can be checked against its source.
          rsync -a --include='*/' --include='*.ogg' --include='manifest.json' \
            --include='verbalization-grades.json' --exclude='*' results/ _site/results/
          echo "index $(du -h _site/index.json | cut -f1), site $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: test/voice-evaluation/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
