# Benchmark ONE text-to-speech model at ONE configuration.
#
# A run measures one model at one config, and nothing else voices while it is
# timed. That is the whole design, and it is a correction: this workflow used to
# take a model LIST and cross it with the shard count, so 7 models x 4 shards
# started 28 jobs at the same instant. They contended for Hugging Face, for npm
# and for the Actions pool while every one of them was being timed, and one arm
# died of ETIMEDOUT inside onnxruntime-node's native postinstall. Whatever those
# wall clocks measured, it was not a property of a model.
#
# To measure several models, use `benchmark-sweep.yml`, which dispatches this
# workflow once per model and WAITS for each to finish. Serial by construction:
# the sweep costs the sum of its runs, and that is the price of a clean reading.
#
# SHARDS ARE THE ONLY PARALLELISM ALLOWED HERE, because a shard is a whole
# 4-vCPU runner voicing its own slice of the corpus rather than a slice of one
# machine's cores. Four shards cut elapsed time roughly fourfold while every
# clip still costs what it would have cost alone.
#
# THIS IS THE ONLY PLACE A COMPARABLE FIGURE COMES FROM. A wall clock read on a
# developer machine may not be compared against the job cap: the same corpus
# measured 2.576 on a laptop and 1.0112 on this runner, which is close enough to
# look plausible and far enough to price a design on the wrong hardware.
#
# WEIGHTS ARE STREAMED AND NEVER COMMITTED. Every model loads from the Hugging
# Face cache on the runner, is memory-mapped for the run, and goes away with the
# runner. The repository carries no weights, so the number of models it can
# compare is bounded by runner RAM rather than by repository size. That ceiling
# is real: 16 GB and 4 vCPU, so roughly 9-10 GB of weights is the practical
# limit and a model past it does not get an arm.
name: benchmark one voice

on:
  workflow_dispatch:
    inputs:
      model:
        description: The ONE model id to measure. See test/voice-evaluation/voices.config.json.
        required: true
        type: string
      shards:
        description: Runners for this model. Each is a whole 4-vCPU machine voicing a slice.
        default: "4"
        type: choice
        options: ["1", "2", "4", "8"]
      maxWordsAChunk:
        description: Where a summary is split for inference. Changes both speed and the seams.
        default: "40"
        type: string
      repeats:
        description: Times each clip is voiced. The median is reported, so >1 defends against one unlucky moment.
        default: "1"
        type: string
      threads:
        description: Inference threads. 0 lets the runtime choose, which is a different config from 4.
        default: "4"
        type: string
      maxItems:
        description: Corpus ceiling, applied before sharding. 0 is the whole corpus.
        default: "0"
        type: string
      grade:
        description: Transcribe the verbalization suite and grade it
        default: true
        type: boolean
      notes:
        description: What this run is tweaking, in your own words. Recorded in the manifest.
        default: ""
        type: string

  # The sweep calls this rather than duplicating it, so a model measured by the
  # sweep and a model measured by hand go through exactly the same steps.
  workflow_call:
    inputs:
      model:
        required: true
        type: string
      shards:
        default: "4"
        type: string
      maxWordsAChunk:
        default: "40"
        type: string
      repeats:
        default: "1"
        type: string
      threads:
        default: "4"
        type: string
      maxItems:
        default: "0"
        type: string
      grade:
        default: true
        type: boolean
      notes:
        default: ""
        type: string

permissions:
  contents: read

# ONE VOICING WORKFLOW AT A TIME, REPOSITORY-WIDE. Every workflow that puts an
# inference job on the runner pool holds this group, which is the only thing
# that makes `RUN_ISOLATED: true` below a true statement rather than a hope.
#
# `cancel-in-progress: false` protects the RUNNING benchmark: a reading that is
# half paid for is not thrown away because somebody dispatched another.
#
# WHAT IT DOES NOT BUY IS A QUEUE. GitHub holds at most one pending run per
# group - a newly queued run cancels whichever run was already pending,
# regardless of this setting. So a third contender arriving while one run holds
# the group and another waits will cancel the waiting one. A sweep leg lost this
# way shows as `cancelled` in the sweep's own summary table rather than
# disappearing, which is the most this can be made to do from inside Actions.
concurrency:
  group: voice-measurement
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      arm: ${{ steps.run.outputs.arm }}
      shards: ${{ steps.run.outputs.shards }}
      shardTotal: ${{ steps.run.outputs.shardTotal }}
      runId: ${{ steps.run.outputs.runId }}
      configSlug: ${{ steps.run.outputs.configSlug }}
      runJson: ${{ steps.run.outputs.runJson }}
    env:
      MODEL: ${{ inputs.model }}
      SHARDS: ${{ inputs.shards }}
      MAX_WORDS_A_CHUNK: ${{ inputs.maxWordsAChunk }}
      REPEATS: ${{ inputs.repeats }}
      THREADS: ${{ inputs.threads }}
      MAX_ITEMS: ${{ inputs.maxItems }}
      NOTES: ${{ inputs.notes }}
      # Asserted by the dispatcher, never inferred by a process that cannot see
      # what else is running. The concurrency group above is what makes it true,
      # and it is the only reason these figures may be compared against the cap.
      RUN_ISOLATED: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The configuration is resolved ONCE, here, and handed to every shard as
      # RUN_JSON. If each shard resolved its own, a workflow edit between two
      # jobs would give two honest but different answers and the merge could not
      # tell a real mismatch from a race.
      - id: run
        run: node .github/scripts/plan-run.mjs

  # ------------------------------------------------------------------ node arm
  node-arm:
    needs: plan
    if: needs.plan.outputs.arm == 'node'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # A shard that fails must not cancel its siblings. A partial set of
      # readings is still a reading, and a shard that dies is itself a finding.
      fail-fast: false
      # Shards only. There is no model axis: this workflow measures one model.
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      RUN_JSON: ${{ needs.plan.outputs.runJson }}
      MODEL: ${{ inputs.model }}
      SHARD_INDEX: ${{ matrix.shard }}
      # Every shard writes somewhere of its own, so shards do not race to write
      # one manifest. The merge job puts them back together afterwards.
      RESULT_DIR: results/${{ inputs.model }}/shard-${{ matrix.shard }}
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/voice-evaluation/package-lock.json

      # Weights are fetched from Hugging Face on first use and are NOT covered
      # by `cache: npm`. Kokoro alone is 326 MB at fp32.
      - name: Cache the weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ inputs.model }}-v2
          restore-keys: hf-

      # onnxruntime-node's postinstall downloads a native binary. One model at a
      # time makes this at most 8 concurrent asks rather than 28, but a
      # transient socket timeout still costs a whole shard, so it retries.
      - name: Install the runtime
        run: |
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Record the runner
        run: |
          echo "cores: $(nproc)"
          lscpu | grep -E 'Model name' || true
          free -g | head -2

      - name: Benchmark
        run: node benchmark-model.mjs

      - name: Grade the verbalization suite
        if: ${{ inputs.grade }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python grade_verbalization.py

      - name: Report
        if: always()
        run: bash report-arm.sh >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Named for the RUN, not just the model, so two configurations of one
          # model can never collide in the artifact store and overwrite each
          # other.
          name: run-${{ needs.plan.outputs.runId }}-shard-${{ matrix.shard }}
          # The whole results tree, so the artifact already carries
          # <model>/shard-N/ and a merge-multiple download reassembles the
          # layout the merge step expects without renaming anything.
          path: test/voice-evaluation/results/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------- python arm
  python-arm:
    needs: plan
    if: needs.plan.outputs.arm == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      RUN_JSON: ${{ needs.plan.outputs.runJson }}
      MODEL: ${{ inputs.model }}
      SHARD_INDEX: ${{ matrix.shard }}
      RESULT_DIR: results/${{ inputs.model }}/shard-${{ matrix.shard }}
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/voice-evaluation/requirements.txt

      # This arm reads its configuration from RUN_JSON and falls back to running
      # the Node resolver when there is none - it must never keep a second copy
      # of the rules. Node is on ubuntu-latest already; pinning it makes the
      # fallback dependable rather than lucky.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # These models are several GB. The cache is what keeps a second run from
      # paying the download again, and the repository still carries nothing.
      - name: Cache the weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-py-${{ inputs.model }}-v2
          restore-keys: hf-py-

      - name: Install the runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Record the runner
        run: |
          echo "cores: $(nproc)"
          lscpu | grep -E 'Model name' || true
          free -g | head -2
          df -h / | tail -1

      # An autoregressive model on a CPU is slow enough that the whole corpus
      # would not finish inside the job. The ceiling is a run input rather than
      # a hardcoded 6, and it is recorded in the manifest, so a capped reading
      # can never be mistaken for an uncapped one.
      - name: Benchmark
        run: python benchmark_genai_model.py

      - name: Grade the verbalization suite
        if: ${{ inputs.grade }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python grade_verbalization.py || echo "grading skipped - no verbalization audio"

      - name: Report
        if: always()
        run: bash report-arm.sh >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ needs.plan.outputs.runId }}-shard-${{ matrix.shard }}
          path: test/voice-evaluation/results/
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------- merge
  merge:
    needs: [plan, node-arm, python-arm]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/download-artifact@v5
        with:
          # This run's shards and nothing else. The pattern carries the run id,
          # so an artifact from another configuration cannot be picked up.
          pattern: run-${{ needs.plan.outputs.runId }}-shard-*
          path: test/voice-evaluation/results
          # Shards of one model are separate artifacts that must land back in a
          # single results/<model>/ tree, so they overlay rather than nest.
          merge-multiple: true

      # The shards are partial readings of one run. This puts them back into
      # one, recomputing the real-time factor from the merged clips rather than
      # averaging four shard figures -- averaging would weight a shard of three
      # short summaries the same as one of nine long ones. It REFUSES to merge
      # shards whose run ids differ.
      - name: Merge the shards
        env:
          MODEL: ${{ inputs.model }}
        run: node merge-shards.mjs

      - name: Report the run
        run: node collate-benchmarks.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: run-${{ needs.plan.outputs.runId }}
          path: |
            test/voice-evaluation/results/comparison.json
            test/voice-evaluation/results/${{ inputs.model }}/manifest.json
            test/voice-evaluation/results/${{ inputs.model }}/verbalization-grades.json
          if-no-files-found: warn
          retention-days: 90
