# Arm transformers-js of the ONNX runtime comparison.
#
# This file is deliberately near-identical to its sibling workflow. The diff
# between the two IS the experiment: same runner, same corpus, same model, one
# library changed. Keep them in step - a difference that is not the library
# under measurement makes the comparison say nothing.
name: compare transformers-js

# This workflow voices models on the runner, so it takes the same lock every
# other voicing workflow takes. A benchmark asserts `run.isolated: true` on the
# strength of this group, and that assertion is only true if EVERY workflow that
# can put an inference job on the pool holds it.
concurrency:
  group: voice-measurement
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      quantisation:
        description: Model quantisation to measure
        default: q8
        type: string
      repeats:
        description: How many times to run the corpus, for spread
        default: "3"
        type: string

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: test/onnx-runtime-comparison/transformers-js
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install the arm
        run: npm install --no-audit --no-fund

      - name: Record the runner
        run: |
          echo "cpu: $(nproc) cores"
          lscpu | grep -E 'Model name|MHz' || true
          free -m | head -2

      - name: Synthesise the corpus
        env:
          QUANTISATION: ${{ inputs.quantisation }}
        run: |
          for run in $(seq 1 ${{ inputs.repeats }}); do
            echo "=== repeat $run of ${{ inputs.repeats }} ==="
            npm run --silent measure
            cp ../measurements/transformers-js.json ../measurements/transformers-js-run-$run.json
          done

      - uses: actions/upload-artifact@v4
        with:
          name: measurements-transformers-js
          path: test/onnx-runtime-comparison/measurements/
          if-no-files-found: error
