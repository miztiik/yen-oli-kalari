# Benchmark every text-to-speech candidate on the hardware that will run it.
#
# One runner per model, in parallel, because the models are independent and the
# run should cost its slowest arm rather than their sum. A shard is a whole
# runner with its own 4 vCPU - not a slice of one machine's cores.
#
# THIS IS THE ONLY PLACE A COMPARABLE FIGURE COMES FROM. A wall clock read on a
# developer machine may not be compared against the job cap: the same corpus
# measured 2.576 on a laptop and 1.0112 on this runner, which is close enough to
# look plausible and far enough to price a design on the wrong hardware.
#
# WEIGHTS ARE STREAMED AND NEVER COMMITTED. Every model loads from the Hugging
# Face cache on the runner, is memory-mapped for the run, and goes away with the
# runner. The repository carries no weights, so the number of models it can
# compare is bounded by runner RAM rather than by repository size. That ceiling
# is real: 16 GB and 4 vCPU, so roughly 9-10 GB of weights is the practical
# limit and a model past it does not get an arm.
name: benchmark voices

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated model ids, or "all"
        default: all
        type: string
      repeats:
        description: Repeats per clip, for spread
        default: "1"
        type: string
      grade:
        description: Transcribe the verbalization suite and grade it
        default: true
        type: boolean
      shards:
        description: Runners per model. Each is a whole 4-vCPU machine voicing a slice of the corpus.
        default: "1"
        type: choice
        options: ["1", "2", "4"]
      ggufItems:
        description: Summaries per GGUF arm. These are autoregressive on a CPU, so the corpus is capped rather than completed.
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-voices
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.fanout.outputs.node }}
      python: ${{ steps.fanout.outputs.python }}
      gguf: ${{ steps.fanout.outputs.gguf }}
      shards: ${{ steps.fanout.outputs.shards }}
      shardTotal: ${{ steps.fanout.outputs.shardTotal }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The model list lives in voices.config.json, so adding one is a row there
      # rather than an edit here. The two runtimes fan out separately because
      # they need different toolchains on the runner.
      - id: fanout
        run: node .github/scripts/plan-benchmark.mjs
        env:
          WANTED: ${{ inputs.models }}
          SHARDS: ${{ inputs.shards }}

  # ---------------------------------------------------------------- node arms
  node-arms:
    needs: plan
    if: needs.plan.outputs.node != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # An arm that fails must not cancel its siblings. A partial set of
      # readings is still a reading, and an arm that dies is itself a finding:
      # "this model does not run on a 4 vCPU runner" is what the benchmark is
      # for.
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.node) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      # Every shard writes somewhere of its own, so four jobs do not race to
      # write one manifest. A merge job puts them back together afterwards.
      RESULT_DIR: results/${{ matrix.model }}/shard-${{ matrix.shard }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.plan.outputs.shardTotal }}
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/voice-evaluation/package-lock.json

      # Weights are fetched from Hugging Face on first use and are NOT covered
      # by `cache: npm`. Kokoro alone is 326 MB at fp32.
      - name: Cache the weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.model }}-v2
          restore-keys: hf-

      # Sharding multiplies this step by the shard count, so a whole model's
      # readings can be lost to one transient socket timeout. onnxruntime-node's
      # postinstall downloads a native binary, and 28 runners asking at once is
      # a thundering herd: the first 4-shard run lost an arm to ETIMEDOUT here.
      - name: Install the runtime
        run: |
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Record the runner
        run: |
          echo "cores: $(nproc)"
          lscpu | grep -E 'Model name' || true
          free -g | head -2

      - name: Benchmark
        env:
          MODEL: ${{ matrix.model }}
          REPEATS: ${{ inputs.repeats }}
        run: node benchmark-model.mjs

      - name: Grade the verbalization suite
        if: ${{ inputs.grade }}
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python grade_verbalization.py

      - name: Report
        if: always()
        env:
          MODEL: ${{ matrix.model }}
        run: bash report-arm.sh >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.model }}-shard-${{ matrix.shard }}
          # The whole results tree, so the artifact already carries
          # <model>/shard-N/ and a merge-multiple download reassembles the
          # layout the merge step expects without renaming anything.
          path: test/voice-evaluation/results/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------- python arms
  python-arms:
    needs: plan
    if: needs.plan.outputs.python != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.python) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      RESULT_DIR: results/${{ matrix.model }}/shard-${{ matrix.shard }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.plan.outputs.shardTotal }}
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/voice-evaluation/requirements.txt

      # These models are several GB. The cache is what keeps a second run from
      # paying the download again, and the repository still carries nothing.
      - name: Cache the weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-py-${{ matrix.model }}-v2
          restore-keys: hf-py-

      - name: Install the runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Record the runner
        run: |
          echo "cores: $(nproc)"
          lscpu | grep -E 'Model name' || true
          free -g | head -2
          df -h / | tail -1

      - name: Benchmark
        env:
          MODEL: ${{ matrix.model }}
          ORT_THREADS: "4"
          # An autoregressive model on a CPU is slow enough that the whole
          # corpus would not finish inside the job. A bounded slice still gives
          # a real real-time factor, which is the figure this arm exists for.
          MAX_ITEMS: "6"
        run: python benchmark_genai_model.py

      - name: Grade the verbalization suite
        if: ${{ inputs.grade }}
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python grade_verbalization.py || echo "grading skipped - no verbalization audio"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.model }}-shard-${{ matrix.shard }}
          path: test/voice-evaluation/results/
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------- gguf arms
  # The third toolchain. These models ship GGUF, which means llama.cpp runs the
  # BACKBONE - and a backbone emits audio codec tokens, not audio. Each arm also
  # carries a neural codec decoder that llama.cpp has no concept of, and Magpie
  # does not use llama.cpp at all: its GGUF needs NVIDIA's own released runtime.
  gguf-arms:
    needs: plan
    if: needs.plan.outputs.gguf != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.gguf) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      RESULT_DIR: results/${{ matrix.model }}/shard-${{ matrix.shard }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.plan.outputs.shardTotal }}
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/voice-evaluation/requirements-gguf.txt

      - name: Cache the weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-gguf-${{ matrix.model }}-v1
          restore-keys: hf-gguf-

      # NeuTTS phonemises before it tokenises, through eSpeak. Absent it, the
      # arm loads and then fails on the first sentence.
      - name: Install eSpeak
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng libsndfile1

      # TORCH AND TORCHAUDIO MUST BOTH COME FROM THE CPU INDEX, AND BEFORE
      # ANYTHING THAT DEPENDS ON THEM. Measured 2026-09-14: installing only
      # `torch` from the CPU index was not enough, because `neucodec` requires
      # torchaudio and pip then resolved it from PyPI - the CUDA build - which
      # fails at import with `OSError: libcudart.so.13`. There is no card on this
      # runner and never will be. Pre-installing both satisfies the requirement
      # so the later resolve leaves them alone.
      #
      # llama-cpp-python is COMPILED. Its own wheel index serves musl-linked
      # binaries that will not load on a glibc runner, and PyPI carries no
      # manylinux wheel, so there is no prebuilt path here. ccache makes the
      # second run of an unchanged pin cheap.
      - name: Install the build toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build ccache

      - name: Cache the llama.cpp build
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-llama-${{ hashFiles('test/voice-evaluation/requirements-gguf.txt') }}
          restore-keys: ccache-llama-

      - name: Install the runtime
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=ON -DLLAVA_BUILD=OFF"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          FORCE_CMAKE: "1"
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          # A RETRY LOOP THAT CANNOT FAIL IS NOT A RETRY LOOP. This one ran out
          # of attempts, fell through, and let the benchmark start against a
          # half-installed environment - which then reported a model failure
          # ("No module named 'snac'") for what was a packaging failure.
          installed=""
          for attempt in 1 2 3; do
            if python -m pip install -r requirements-gguf.txt; then installed=yes; break; fi
            echo "pip failed (attempt ${attempt}/3), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          [ -n "$installed" ] || { echo "::error::the GGUF runtime did not install"; exit 1; }
          python -c "import llama_cpp, snac; print('llama-cpp-python', llama_cpp.__version__)"

      # Only the NeuTTS arm pays for this, and only the NeuTTS arm fails if it
      # breaks. Its dependency chain is documented in the requirements file.
      - name: Install the NeuTTS runtime
        if: startsWith(matrix.model, 'neutts')
        run: python -m pip install -r requirements-neutts.txt

      - name: Record the runner
        run: |
          echo "cores: $(nproc)"
          lscpu | grep -E 'Model name' || true
          free -g | head -2
          df -h / | tail -1
          python -c "import llama_cpp; print('llama-cpp-python', llama_cpp.__version__)" || true

      # WHICH ACCOUNT, AND CAN IT REACH THE GATE? A 403 on a gated repository
      # has two causes that look identical from the traceback: the account has
      # not accepted the terms, or a fine-grained token lacks "Read access to
      # contents of all public gated repos". This says which, without printing
      # the token. It runs only for the arm that needs one.
      - name: Check the gated-repo credential
        if: startsWith(matrix.model, 'neutts')
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN") or None
          print("HF_TOKEN present:", bool(token))
          api = HfApi(token=token)
          try:
              me = api.whoami()
              print("authenticated as:", me.get("name"), "| type:", me.get("type"))
              auth = (me.get("auth") or {}).get("accessToken") or {}
              print("token role:", auth.get("role"), "| name:", auth.get("displayName"))
          except Exception as exc:
              print("whoami FAILED:", type(exc).__name__, exc)
          for repo in ("neuphonic/neucodec", "neuphonic/neutts-air-q4-gguf"):
              try:
                  info = api.model_info(repo)
                  print(f"{repo}: reachable, gated={info.gated}")
              except Exception as exc:
                  print(f"{repo}: {type(exc).__name__} -> {str(exc)[:200]}")
          PY

      - name: Benchmark
        env:
          MODEL: ${{ matrix.model }}
          GGUF_THREADS: "4"
          # Only the NeuTTS arm needs this, and only for the codec encoder:
          # `neucodec` refuses any substitute by name, and both names it accepts
          # are gated. Empty is fine for every other arm - all of their weights
          # stream anonymously.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # An autoregressive backbone plus a codec decoder, on four cores with
          # no GPU, is the slowest thing this harness runs. A bounded slice
          # still yields a real real-time factor, which is the figure this arm
          # exists for; finishing the corpus is not.
          MAX_ITEMS: ${{ inputs.ggufItems }}
        run: python benchmark_gguf_model.py

      - name: Grade the verbalization suite
        if: ${{ inputs.grade }}
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python -m pip install --quiet faster-whisper
          python grade_verbalization.py || echo "grading skipped - no verbalization audio"

      - name: Report
        if: always()
        env:
          MODEL: ${{ matrix.model }}
        run: bash report-arm.sh >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.model }}-shard-${{ matrix.shard }}
          path: test/voice-evaluation/results/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------ collate
  collate:
    needs: [plan, node-arms, python-arms, gguf-arms]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/download-artifact@v5
        with:
          pattern: benchmark-*
          path: test/voice-evaluation/results
          # Shards of one model are separate artifacts that must land back in a
          # single results/<model>/ tree, so they overlay rather than nest.
          merge-multiple: true

      # Four shards are four partial readings of the same model. This puts them
      # back into one run, recomputing the real-time factor from the merged
      # clips rather than averaging four shard figures -- averaging would weight
      # a shard of three short summaries the same as one of nine long ones.
      - name: Merge the shards of each model
        run: |
          set -euo pipefail
          for dir in results/*/; do
            model=$(basename "$dir")
            MODEL="$model" node merge-shards.mjs
          done

      - name: Rank every arm that finished
        run: node collate-benchmarks.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: test/voice-evaluation/results/comparison.json
          if-no-files-found: warn
