# Benchmark every text-to-speech candidate on the hardware that will run it.
#
# One runner per model, in parallel, because the models are independent and the
# run should cost its slowest arm rather than their sum. A shard is a whole
# runner with its own 4 vCPU - not a slice of one machine's cores.
#
# THIS IS THE ONLY PLACE A COMPARABLE FIGURE COMES FROM. A wall clock read on a
# developer machine may not be compared against the job cap: the same corpus
# measured 2.576 on a laptop and 1.0112 on this runner, which is close enough to
# look plausible and far enough to price a design on the wrong hardware.
#
# WEIGHTS ARE STREAMED AND NEVER COMMITTED. Every model loads from the Hugging
# Face cache on the runner, is memory-mapped for the run, and goes away with the
# runner. The repository carries no weights, so the number of models it can
# compare is bounded by runner RAM rather than by repository size. That ceiling
# is real: 16 GB and 4 vCPU, so roughly 9-10 GB of weights is the practical
# limit and a model past it does not get an arm.
name: benchmark voices

on:
  workflow_dispatch:
    inputs:
      models:
        description: Comma-separated model ids, or "all"
        default: all
        type: string
      repeats:
        description: Repeats per clip, for spread
        default: "1"
        type: string
      grade:
        description: Transcribe the verbalization suite and grade it
        default: true
        type: boolean
      shards:
        description: Runners per model. Each is a whole 4-vCPU machine voicing a slice of the corpus.
        default: "1"
        type: choice
        options: ["1", "2", "4"]

permissions:
  contents: read

concurrency:
  group: benchmark-voices
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.fanout.outputs.node }}
      python: ${{ steps.fanout.outputs.python }}
      shards: ${{ steps.fanout.outputs.shards }}
      shardTotal: ${{ steps.fanout.outputs.shardTotal }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The model list lives in voices.config.json, so adding one is a row there
      # rather than an edit here. The two runtimes fan out separately because
      # they need different toolchains on the runner.
      - id: fanout
        run: node .github/scripts/plan-benchmark.mjs
        env:
          WANTED: ${{ inputs.models }}
          SHARDS: ${{ inputs.shards }}

  # ---------------------------------------------------------------- node arms
  node-arms:
    needs: plan
    if: needs.plan.outputs.node != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # An arm that fails must not cancel its siblings. A partial set of
      # readings is still a reading, and an arm that dies is itself a finding:
      # "this model does not run on a 4 vCPU runner" is what the benchmark is
      # for.
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.node) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      # Every shard writes somewhere of its own, so four jobs do not race to
      # write one manifest. A merge job puts them back together afterwards.
      RESULT_DIR: results/${{ matrix.model }}/shard-${{ matrix.shard }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.plan.outputs.shardTotal }}
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: test/voice-evaluation/package-lock.json

      # Weights are fetched from Hugging Face on first use and are NOT covered
      # by `cache: npm`. Kokoro alone is 326 MB at fp32.
      - name: Cache the weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.model }}-v2
          restore-keys: hf-

      # Sharding multiplies this step by the shard count, so a whole model's
      # readings can be lost to one transient socket timeout. onnxruntime-node's
      # postinstall downloads a native binary, and 28 runners asking at once is
      # a thundering herd: the first 4-shard run lost an arm to ETIMEDOUT here.
      - name: Install the runtime
        run: |
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci failed (attempt ${attempt}/3), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Record the runner
        run: |
          echo "cores: $(nproc)"
          lscpu | grep -E 'Model name' || true
          free -g | head -2

      - name: Benchmark
        env:
          MODEL: ${{ matrix.model }}
          REPEATS: ${{ inputs.repeats }}
        run: node benchmark-model.mjs

      - name: Grade the verbalization suite
        if: ${{ inputs.grade }}
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python grade_verbalization.py

      - name: Report
        if: always()
        env:
          MODEL: ${{ matrix.model }}
        run: bash report-arm.sh >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.model }}-shard-${{ matrix.shard }}
          # The whole results tree, so the artifact already carries
          # <model>/shard-N/ and a merge-multiple download reassembles the
          # layout the merge step expects without renaming anything.
          path: test/voice-evaluation/results/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------- python arms
  python-arms:
    needs: plan
    if: needs.plan.outputs.python != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.python) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      RESULT_DIR: results/${{ matrix.model }}/shard-${{ matrix.shard }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.plan.outputs.shardTotal }}
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test/voice-evaluation/requirements.txt

      # These models are several GB. The cache is what keeps a second run from
      # paying the download again, and the repository still carries nothing.
      - name: Cache the weights
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-py-${{ matrix.model }}-v2
          restore-keys: hf-py-

      - name: Install the runtime
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Record the runner
        run: |
          echo "cores: $(nproc)"
          lscpu | grep -E 'Model name' || true
          free -g | head -2
          df -h / | tail -1

      - name: Benchmark
        env:
          MODEL: ${{ matrix.model }}
          ORT_THREADS: "4"
          # An autoregressive model on a CPU is slow enough that the whole
          # corpus would not finish inside the job. A bounded slice still gives
          # a real real-time factor, which is the figure this arm exists for.
          MAX_ITEMS: "6"
        run: python benchmark_genai_model.py

      - name: Grade the verbalization suite
        if: ${{ inputs.grade }}
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python -m pip install --quiet -r requirements.txt
          python grade_verbalization.py || echo "grading skipped - no verbalization audio"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.model }}-shard-${{ matrix.shard }}
          path: test/voice-evaluation/results/
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------ collate
  collate:
    needs: [plan, node-arms, python-arms]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: test/voice-evaluation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: actions/download-artifact@v5
        with:
          pattern: benchmark-*
          path: test/voice-evaluation/results
          # Shards of one model are separate artifacts that must land back in a
          # single results/<model>/ tree, so they overlay rather than nest.
          merge-multiple: true

      # Four shards are four partial readings of the same model. This puts them
      # back into one run, recomputing the real-time factor from the merged
      # clips rather than averaging four shard figures -- averaging would weight
      # a shard of three short summaries the same as one of nine long ones.
      - name: Merge the shards of each model
        run: |
          set -euo pipefail
          for dir in results/*/; do
            model=$(basename "$dir")
            MODEL="$model" node merge-shards.mjs
          done

      - name: Rank every arm that finished
        run: node collate-benchmarks.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: test/voice-evaluation/results/comparison.json
          if-no-files-found: warn
